<svg width="700" height="500" viewBox="0 0 700 500" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="wtwGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B1F75"/>
      <stop offset="50%" stop-color="#7133A2"/>
      <stop offset="100%" stop-color="#B56DDA"/>
    </linearGradient>

    <linearGradient id="globeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCCCF1"/>
      <stop offset="100%" stop-color="#B090D0"/>
    </linearGradient>
  </defs>

  <!-- Globe -->
  <circle
      cx="350"
      cy="180"
      r="130"
      fill="none"
      stroke="url(#globeGradient)"
      stroke-width="5"/>

  <!-- Latitude -->
  <ellipse
      cx="350"
      cy="180"
      rx="115"
      ry="40"
      fill="none"
      stroke="url(#globeGradient)"
      stroke-width="4"/>

  <ellipse
      cx="350"
      cy="180"
      rx="115"
      ry="80"
      fill="none"
      stroke="url(#globeGradient)"
      stroke-width="4"/>

  <!-- Longitude -->
  <ellipse
      cx="350"
      cy="180"
      rx="55"
      ry="130"
      fill="none"
      stroke="url(#globeGradient)"
      stroke-width="4"/>

  <ellipse
      cx="350"
      cy="180"
      rx="92"
      ry="130"
      fill="none"
      stroke="url(#globeGradient)"
      stroke-width="4"/>

  <!-- Connections -->
  <line x1="350" y1="180" x2="350" y2="60"
        stroke="#B56DDA" stroke-width="2"/>

  <line x1="350" y1="180" x2="245" y2="110"
        stroke="#B56DDA" stroke-width="2"/>

  <line x1="350" y1="180" x2="455" y2="110"
        stroke="#B56DDA" stroke-width="2"/>

  <circle cx="350" cy="60" r="7" fill="#B56DDA"/>
  <circle cx="245" cy="110" r="7" fill="#B56DDA"/>
  <circle cx="455" cy="110" r="7" fill="#B56DDA"/>

  <!-- AI -->
  <g transform="translate(230 110)">
    <path
      d="M60 0 L120 135 H95 L82 100 H38 L25 135 H0 L60 0Z
         M50 70 H72 L60 42 Z"
      fill="url(#wtwGradient)"/>

    <rect
      x="150"
      y="0"
      width="28"
      height="135"
      rx="14"
      fill="url(#wtwGradient)"/>

    <rect
      x="128"
      y="0"
      width="72"
      height="26"
      rx="13"
      fill="url(#wtwGradient)"/>

    <rect
      x="128"
      y="109"
      width="72"
      height="26"
      rx="13"
      fill="url(#wtwGradient)"/>
  </g>

  <!-- Team Name -->
  <text
      x="350"
      y="390"
      text-anchor="middle"
      font-family="Segoe UI, Arial"
      font-size="28"
      font-weight="700"
      fill="#4B1F75">
      WE AI IMPLEMENTATION
  </text>

  <text
      x="350"
      y="425"
      text-anchor="middle"
      font-family="Segoe UI, Arial"
      font-size="24"
      font-weight="500"
      fill="#7133A2">
      ANALYSTS
  </text>

</svg>
